<!DOCTYPE html>
<html lang="ca" color-mode="user">

<head>
    <meta charset="utf-8">
    <title>{SITE_NAME} :: Canviar contrasenya</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Antonio Bueno (UdG)">
    <link rel="icon" href="/favicon.png">
    <link rel="stylesheet" href="mvp.css">
    <link rel="stylesheet" href="el_meu.css">
    <script defer src="el_meu.js"></script>
</head>

<body>
    <main>
        <header>
            <h1><a href="/">{SITE_NAME}</a></h1>
            <div>{FEEDBACK}</div>
        </header>
        <section>
            <form method="{METHOD}" action="/?page=change_password">
                <header>
                    <h2>Canviar la contrasenya</h2>
                </header>
                <label for="current_password">Contrasenya actual</label>
                <input id="current_password" type="password" name="current_password" required />
                <label for="new_password">Nova contrasenya</label>
                <input id="new_password" type="password" name="new_password" required />
                <label for="confirm_password">Confirma la nova contrasenya</label>
                <input id="confirm_password" type="password" name="confirm_password" required />
                <input type="submit" name="change_password" value="Canviar contrasenya" />
            </form>
        </section>
        <section>
            <div>
                <a href="/">Tornar a l'inici</a>
            </div>
        </section>
    </main>
</body>

</html>
